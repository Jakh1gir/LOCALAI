[project]
name = "localai"
version = "0.1.0"
description = "LOCALAI: единая инженерная база с каталогом ККС и встроенным ИИ"
requires-python = ">=3.13"
# Пакет engine использует только стандартную библиотеку. Зависимости сервера
# и ИИ-службы добавляются вместе с их кодом.
dependencies = []

[project.optional-dependencies]
# Сервер написан на Starlette (основа FastAPI) и Pydantic; cryptography шифрует копии и
# создаёт сертификат HTTPS; openpyxl читает книги Excel при переносе; numpy считает сходство
# векторов в поиске по смыслу. Версии — те, на которых
# сервер проверен.
server = [
    "starlette>=1.7",
    "pydantic>=2.13",
    "uvicorn>=0.54",
    "cryptography>=50",
    "openpyxl>=3.1",
    # Поиск по смыслу (server/vector_index.py): дополнение SQLite sqlite-vec — основной способ
    # (до версии 1.0, поэтому версия закреплена); numpy — запасной поиск в памяти и проверка.
    "sqlite-vec==0.1.9",
    "numpy>=2",
]
# ИИ-служба — на той же основе, что и сервер: Starlette и Uvicorn. Модель (Ollama) ставится
# отдельно и в зависимости не входит (REL-01); с ней служба говорит по HTTP.
ai = ["starlette>=1.7", "uvicorn>=0.54"]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "server*", "ai*"]

[tool.setuptools.package-data]
engine = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
